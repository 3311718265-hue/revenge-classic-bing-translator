name: Initial publication and Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-initial.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore reviewed source once
        env:
          SOURCE_ARCHIVE: ''
          SOURCE_SHA256: '5389be21f10cafb7b5c936335ecbf71189b0b0b244af01805543fb8405884dd2'
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),zlib=require('zlib'),crypto=require('crypto');
          if(fs.existsSync('.github/initial-publication.done'))process.exit(0);
          const data=zlib.gunzipSync(Buffer.from(process.env.SOURCE_ARCHIVE,'base64'));
          if(crypto.createHash('sha256').update(data).digest('hex')!==process.env.SOURCE_SHA256)throw Error('Source archive hash mismatch');
          for(const file of JSON.parse(data)){
            if(!file.path||file.path.startsWith('/')||file.path.split('/').includes('..')||file.path.startsWith('.git/'))throw Error('Invalid source path');
            fs.mkdirSync(path.dirname(file.path),{recursive:true});fs.writeFileSync(file.path,file.content);
          }
          fs.writeFileSync('.github/initial-publication.done',process.env.SOURCE_SHA256+'\n');
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Commit verified source and install files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/initial-publication.done .github/workflows/pages.yml .gitignore bing-translator docs LICENSE package-lock.json package.json README.md scripts site src tests tsconfig.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish tested Revenge Classic Bing translator source and install files'
            git push origin main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
