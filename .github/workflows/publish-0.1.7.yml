name: Publish selected-message translation 0.1.7
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed batch selection update
        env:
          SOURCE_ARCHIVE: ''
          SOURCE_SHA256: '7e9ce90d506b2049dc938389abe934a87f3f4f9916f54321ced830fba87f89ef'
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),zlib=require('zlib'),crypto=require('crypto');
          const sha=x=>crypto.createHash('sha256').update(x).digest('hex');
          const data=zlib.gunzipSync(Buffer.from(process.env.SOURCE_ARCHIVE,'base64'));
          if(sha(data)!==process.env.SOURCE_SHA256)throw Error('Update archive hash mismatch');
          const files=JSON.parse(data);
          for(const file of files){
            if(!file.path||file.path.startsWith('/')||file.path.split('/').includes('..')||file.path.startsWith('.git'))throw Error('Invalid update path');
            const current=fs.existsSync(file.path)?sha(fs.readFileSync(file.path)):null;
            if(current!==file.previous&&current!==sha(file.content))throw Error('Target changed since review: '+file.path);
          }
          for(const file of files){fs.mkdirSync(path.dirname(file.path),{recursive:true});fs.writeFileSync(file.path,file.content);}
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Refresh raw Source URL files
        run: |
          mkdir -p bing-translator
          cp dist/bing-translator/manifest.json dist/bing-translator/index.js bing-translator/
      - name: Commit tested update and installation files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime/classic.ts src/core/service.ts src/ui/components.ts tests/ui.test.ts tests/selection.test.ts package.json package-lock.json README.md site/index.html docs/TESTING.md bing-translator
          if ! git diff --cached --quiet; then
            git commit -m 'Add selected-message batch translation without result dialogs in Classic translator 0.1.7'
            git push origin main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
